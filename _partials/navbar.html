<!--
  MODÈLE COMMUN AUTHENTIK VIETNAM : NAVBAR
  Ce fichier n'est pas une page : il sert à copier-coller le même bloc dans chaque page.
  (Firebase ne le publie pas : « _partials/** » est exclu dans firebase.json.)

  Dans une nouvelle page :
  1. Dans <head> : les polices Google (Raleway + Be Vietnam Pro, voir l'en-tête de assets/site/typo.css),
     puis site.css AVANT la feuille de la page, et typo.css APRÈS :
       <link rel="stylesheet" href="RACINE/assets/site/site.css?v=1">
       <link rel="stylesheet" href="RACINE/assets/css/(feuille de la page).css">
       <link rel="stylesheet" href="RACINE/assets/site/typo.css?v=1">
  2. Juste avant </body> :
       <script src="RACINE/assets/site/site.js?v=1" defer></script>
  3. Remplacer RACINE par le chemin vers la racine du site :
       page à la racine (hub)            → rien     (ex. assets/site/site.css)
       page dans un dossier (/xxx/)      → ../      (ex. ../assets/site/site.css)
  4. La page doit avoir <main id="contenu"> (le bouton « haut de page » y renvoie).

  MENU : quand une nouvelle page est en ligne, ajouter son lien ici ET dans toutes les pages
  (même ordre partout). Sur la page en cours, ajouter aria-current="page" à son lien
  (dans le menu ordinateur ET le menu mobile).
  Option : un sommaire propre à la page peut être ajouté juste avant </header>
  (voir « Sur cette page » dans quand-partir-au-vietnam/index.html).
-->
