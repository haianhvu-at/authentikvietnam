name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 22 * * *'   # 05:47 giờ VN, sau khi cập nhật thời tiết
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/811044107596/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-deploy@authentik-vietnam.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx -y firebase-tools@latest deploy --only hosting --project authentik-vietnam --non-interactive
